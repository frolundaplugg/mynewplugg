<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Min Studieportal - En fokuserad studieapp för årskurs 7 med timer, uppgifter, quiz och AI-coach." />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Min Studieportal - Fokus & Repetition för Årskurs 7</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%238b5cf6' width='100' height='100'/><text x='50' y='70' font-size='60' fill='white'>📚</text></svg>" />
  <style>
    :root {
      --bg-1: #120b1d;
      --bg-2: #1a1230;
      --bg-3: #0d1525;
      --panel: rgba(17, 24, 39, 0.85);
      --panel-strong: rgba(18, 29, 46, 0.96);
      --panel-soft: rgba(26, 35, 52, 0.8);
      --border: rgba(148, 163, 184, 0.18);
      --text: #edf3ff;
      --muted: #bcc9e6;
      --primary: #8b5cf6;
      --primary-strong: #6d4efb;
      --secondary: #38bdf8;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 24%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1) 26%, var(--bg-3) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 22px 16px 48px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      background: rgba(14, 20, 31, 0.82);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 12px;
      z-index: 30;
    }
    .brand-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .brand { font-weight: 800; letter-spacing: 0.03em; font-size: clamp(1.2rem, 2.5vw, 1.8rem); display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #8b5cf6, #38bdf8); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(139, 92, 246, 0.45);
    }
    .welcome-text { color: var(--muted); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.02em; }
    .user-name-box {
      display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(148, 163, 184, 0.16); border-radius: 14px; padding: 8px 12px; min-width: min(100%, 280px);
    }
    .user-name-box input { background: transparent; border: none; color: var(--text); width: 100%; margin: 0; padding: 8px 0; font-size: 0.95rem; outline: none; }
    .user-name-box button { margin: 0; width: auto; min-width: 85px; padding: 8px 12px; font-size: 0.8rem; }
    .badge { display: inline-flex; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .box { background: linear-gradient(180deg, rgba(17,24,39,0.9), rgba(16,20,32,0.84)); border: 1px solid var(--border); border-radius: 22px; padding: 20px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.02); }
    .box.wide { grid-column: 1 / -1; }
    .box h3 { font-size: 1.15rem; margin: 0 0 14px 0; color: var(--text); font-weight: 800; }
    button, .link-btn, input, select, textarea { font: inherit; }
    button, .link-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white; border: none; border-radius: 12px; padding: 11px 16px; cursor: pointer; width: 100%; margin-top: 10px; text-align: center; text-decoration: none; display: block; font-weight: 700; transition: transform 0.15s ease, opacity 0.2s ease; box-shadow: 0 8px 18px rgba(109, 78, 251, 0.2);
    }
    button:hover, .link-btn:hover { transform: translateY(-1px); opacity: 0.98; }
    .secondary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .success { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .outline { background: rgba(148, 163, 184, 0.08); border: 1px solid rgba(148, 163, 184, 0.2); color: var(--text); }
    input, select, textarea {
      width: 100%; background: rgba(15, 23, 42, 0.9); color: var(--text); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 12px; padding: 11px 12px; margin-bottom: 10px; outline: none; font-size: 0.95rem;
    }
    .inline-row { display: flex; gap: 10px; align-items: flex-end; }
    .inline-row input { flex: 1; margin: 0; }
    .timer-value { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: 0.05em; margin: 14px 0 20px; font-variant-numeric: tabular-nums; color: #60a5fa; }
    .chat { height: 150px; overflow-y: auto; background: rgba(10, 16, 24, 0.9); padding: 14px; border-radius: 14px; border: 1px solid rgba(148, 163, 184, 0.14); margin-bottom: 10px; line-height: 1.6; }
    .score-board, .task-list, .contact-list { list-style: none; padding: 0; margin: 0; }
    .score-board li, .task-list li, .contact-list li { background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(148, 163, 184, 0.08); border-left: 4px solid var(--secondary); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .done { text-decoration: line-through; opacity: 0.5; }
    .notification { position: fixed; bottom: 20px; right: 20px; background: rgba(34, 197, 94, 0.95); color: white; padding: 14px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3); z-index: 99; }
    .notification.error { background: rgba(239, 68, 68, 0.95); }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand"><span class="brand-mark">📚</span> Min Studieportal</div>
        <div id="welcomeText" class="welcome-text">Hej, elev!</div>
      </div>
      <div class="user-name-box">
        <input id="usernameInput" type="text" placeholder="Ditt namn" autocomplete="off" />
        <button class="secondary" onclick="saveUserName()">Spara</button>
      </div>
      <div class="badge">Årskurs 7 • Fokus & Repetition</div>
    </header>

    <div class="grid">
      <div class="box">
        <h3>⏱️ Timer</h3>
        <div class="timer-value" id="t">25:00</div>
        <div class="inline-row">
          <input id="customMin" type="number" min="1" max="180" value="25" placeholder="Minuter" />
          <button class="secondary" onclick="setCustomTime()">Sätt</button>
        </div>
        <button onclick="tgT()">▶️ Start / Paus</button>
        <button class="outline" onclick="rsT()">🔄 Nollställ</button>
      </div>

      <div class="box">
        <h3>👥 Gruppstudier</h3>
        <a href="https://meet.new" target="_blank" class="link-btn success">📞 Google Meet</a>
        <a href="https://zoom.new" target="_blank" class="link-btn secondary">📹 Zoom-möte</a>
      </div>

      <div class="box wide">
        <h3>📞 Telefonbok</h3>
        <input id="contactName" placeholder="Namn..." />
        <input id="contactPhone" placeholder="Nummer..." />
        <button class="success" onclick="addContact()">+ Spara</button>
        <ul id="contactList" class="contact-list"></ul>
      </div>

      <div class="box wide">
        <h3>🏆 Topplista</h3>
        <div class="inline-row">
          <input id="pName" placeholder="Namn..." />
          <button class="secondary" onclick="addFriend()">+ Spelare</button>
        </div>
        <button class="danger" onclick="resetScores()">Nollställ matchen</button>
        <ul id="leaderboard" class="score-board"><li><span>👑 Du</span><span>0 p</span></li></ul>
      </div>

      <div class="box">
        <h3>🤖 AI-Coach</h3>
        <div id="cb" class="chat">AI: Tjena! Dags för fokuserad studier! Säg till om du behöver tips eller motivation.</div>
        <input id="ci" placeholder="Skriv fråga..." />
        <button onclick="sdA()">📤 Skicka</button>
      </div>

      <div class="box">
        <h3>✅ Uppgifter</h3>
        <input id="ti" placeholder="Ny läxa..." />
        <button class="success" onclick="adT()">+ Spara</button>
        <ul id="tl" class="task-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = { userName: 'studyportal-user', contacts: 'studyportal-contacts', players: 'studyportal-players', tasks: 'studyportal-tasks', timerSettings: 'studyportal-timer-settings' };
    const state = { timerSeconds: 25 * 60, timerId: null, isRunning: false, players: [{ id: 0, name: 'Du', score: 0 }] };

    function safeJsonParse(value, fallback) { try { return value ? JSON.parse(value) : fallback; } catch (error) { return fallback; } }
    function showNotification(message, isError = false) { const notif = document.createElement('div'); notif.className = 'notification' + (isError ? ' error' : ''); notif.textContent = message; document.body.appendChild(notif); setTimeout(() => notif.remove(), 1800); }
    function saveUserName() { const input=document.getElementById('usernameInput'); const greeting=document.getElementById('welcomeText'); const name=input.value.trim(); if (!name) { greeting.textContent='Hej, elev!'; localStorage.removeItem(STORAGE_KEYS.userName); return; } localStorage.setItem(STORAGE_KEYS.userName, name); greeting.textContent=`Hej, ${name}!`; }
    function loadUserName() { const savedName = localStorage.getItem(STORAGE_KEYS.userName); const input = document.getElementById('usernameInput'); const greeting = document.getElementById('welcomeText'); if (savedName) { input.value = savedName; greeting.textContent = `Hej, ${savedName}!`; } }
    function userCoachMessage(message) { const cb = document.getElementById('cb'); const time = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }); cb.innerHTML += `<br><b>Du</b> (${time}): ${message}`; cb.scrollTop = cb.scrollHeight; }
    function aiCoachMessage(message) { const cb = document.getElementById('cb'); const time = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }); cb.innerHTML += `<br><b>AI</b> (${time}): ${message}`; cb.scrollTop = cb.scrollHeight; }
    function upT() { const minutes = Math.floor(state.timerSeconds / 60); const seconds = state.timerSeconds % 60; document.getElementById('t').textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`; }
    function setCustomTime() { if (state.isRunning) return; const value = parseInt(document.getElementById('customMin').value, 10); if (!isNaN(value) && value > 0 && value <= 180) { state.timerSeconds = value * 60; upT(); showNotification(`Timer satt till ${value} min`); } }
    function tgT() { if (state.isRunning) { clearInterval(state.timerId); state.isRunning = false; showNotification('⏸️ Pausad'); return; } state.isRunning = true; showNotification('⏱️ Timer igång'); state.timerId = setInterval(() => { if (state.timerSeconds > 0) { state.timerSeconds--; upT(); } else { clearInterval(state.timerId); state.isRunning = false; showNotification('⏰ Klar! Ta en kort paus.', true); } }, 1000); }
    function rsT() { clearInterval(state.timerId); const value = parseInt(document.getElementById('customMin').value, 10); state.timerSeconds = (!isNaN(value) && value > 0) ? value * 60 : 25 * 60; state.isRunning = false; upT(); }
    function addContact() { const name = document.getElementById('contactName').value.trim(); const phone = document.getElementById('contactPhone').value.trim(); if (!name || !phone) { showNotification('Fyll i namn och nummer', true); return; } const list = document.getElementById('contactList'); const li = document.createElement('li'); li.innerHTML = `<span>${name}</span><span>${phone}</span>`; list.appendChild(li); document.getElementById('contactName').value=''; document.getElementById('contactPhone').value=''; }
    function addFriend() { const name = document.getElementById('pName').value.trim(); if (!name) { showNotification('Skriv ett namn', true); return; } const list = document.getElementById('leaderboard'); const li = document.createElement('li'); li.innerHTML = `<span>🏆 ${name}</span><span>0 p</span>`; list.appendChild(li); document.getElementById('pName').value=''; }
    function resetScores() { document.getElementById('leaderboard').innerHTML = '<li><span>👑 Du</span><span>0 p</span></li>'; }
    function adT() { const name = document.getElementById('ti').value.trim(); if (!name) { showNotification('Skriv en uppgift', true); return; } const list = document.getElementById('tl'); const li = document.createElement('li'); li.innerHTML = `<span>${name}</span><button class="outline" onclick="this.parentNode.classList.toggle('done')">Klar</button>`; list.appendChild(li); document.getElementById('ti').value=''; }
    function loadTasks() { const saved = safeJsonParse(localStorage.getItem(STORAGE_KEYS.tasks), []); const list = document.getElementById('tl'); list.innerHTML = ''; saved.forEach(task => { const li = document.createElement('li'); li.innerHTML = `<span>${task}</span><button class="outline" onclick="this.parentNode.classList.toggle('done')">Klar</button>`; list.appendChild(li); }); }
    function sdA() { const question = document.getElementById('ci').value.trim(); if (!question) { showNotification('Skriv en fråga', true); return; } userCoachMessage(question); const answers = [ 'Bra jobbat! Fortsätt med en liten repetition och ta en kort paus mellan övningarna.', 'Det viktigaste nu är att fokusera på det du kan göra direkt. Börja med det lättaste ämnet först.', 'Du har redan kommit långt. Sätt en liten målbild för nästa 10 minuter och gör den.' ]; const answer = answers[Math.floor(Math.random() * answers.length)]; aiCoachMessage(answer); document.getElementById('ci').value=''; }
    loadUserName();
    loadTasks();
    rsT();
    (function () {
      try {
        const target = Array.from(document.querySelectorAll('*')).find(el => el.textContent && el.textContent.includes('Prov från Studiematerial'));
        if (target) {
          const container = target.closest('#studyBox') || target.closest('.box');
          if (container) container.remove();
        }
      } catch (e) {
        console.error('Study promo removal script error:', e);
      }
    })();
  </script>
</body>
</html>
