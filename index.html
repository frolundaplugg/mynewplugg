<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kunna inför provet</title>
    <style>
      :root {
        --bg: #e8e7e5;
        --page-bg: #f3f3f1;
        --header: #1f4d50;
        --header-text: #eef3f1;
        --row-light: #dfeae7;
        --row-dark: #d5e4e0;
        --line: #c7d1ce;
        --text: #1b2a2b;
        --muted: #586f72;
        --accent: #58687a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .page {
        max-width: 980px;
        margin: 30px auto;
        background: var(--page-bg);
        border: 1px solid #d4d4d2;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
      }

      .hero {
        background: var(--header);
        color: var(--header-text);
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        min-height: 180px;
        padding: 24px 0 18px 24px;
      }

      .hero-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 2vw + 1.5rem, 3.4rem);
        line-height: 1.1;
        font-weight: 700;
      }

      .subtitle {
        margin-top: 14px;
        font-size: 0.95rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.92);
      }

      .hero-image {
        width: 260px;
        min-width: 180px;
        background:
          linear-gradient(rgba(18, 54, 57, 0.25), rgba(18, 54, 57, 0.25)),
          url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
        border-left: 1px solid rgba(255,255,255,0.18);
      }

      .section {
        border-top: 1px solid var(--line);
      }

      .section-title {
        background: rgba(255,255,255,0.12);
        color: #2c5d67;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 14px 18px 12px;
      }

      .checklist {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .checklist li {
        display: flex;
        align-items: center;
        min-height: 60px;
        padding: 0 16px 0 12px;
        border-top: 1px solid var(--line);
      }

      .checklist li:nth-child(odd) {
        background: var(--row-light);
      }

      .checklist li:nth-child(even) {
        background: var(--row-dark);
      }

      .checklist input[type='checkbox'] {
        width: 18px;
        height: 18px;
        accent-color: #2d5e62;
        margin-right: 12px;
        flex-shrink: 0;
      }

      .label {
        flex: 1;
        font-size: 1.04rem;
        line-height: 1.45;
        color: var(--text);
      }

      .tag {
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
        white-space: nowrap;
        margin-left: 8px;
      }

      @media (max-width: 720px) {
        .hero {
          flex-direction: column;
          padding-left: 18px;
          padding-right: 0;
        }

        .hero-image {
          width: 100%;
          min-height: 140px;
          border-left: none;
          border-top: 1px solid rgba(255,255,255,0.18);
        }

        .label {
          font-size: 0.96rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-content">
          <h1>Kunna inför provet</h1>
          <div class="subtitle">Årskurs 7 &nbsp; Lektion 1–6</div>
        </div>
        <div class="hero-image" aria-label="Nature image"></div>
      </header>

      <section class="section">
        <div class="section-title">Livet behöver energi</div>
        <ul class="checklist">
          <li>
            <input type="checkbox" id="q1" />
            <label class="label" for="q1">Jag kan förklara fotosyntesens viktigaste ämnen och solens roll.</label>
            <span class="tag">• L1</span>
          </li>
          <li>
            <input type="checkbox" id="q2" />
            <label class="label" for="q2">Jag kan förklara att växter och djur använder cellandning för att få tillgång till energi.</label>
            <span class="tag">• L1</span>
          </li>
        </ul>
      </section>

      <section class="section">
        <div class="section-title">Samband i ekosystem</div>
        <ul class="checklist">
          <li>
            <input type="checkbox" id="q3" />
            <label class="label" for="q3">Jag kan läsa en ny text för att få information om hur organismer påverkar varandra.</label>
            <span class="tag">• L2</span>
          </li>
          <li>
            <input type="checkbox" id="q4" />
            <label class="label" for="q4">Jag kan förklara varför föda och andra resurser begränsar hur stor en population kan bli.</label>
            <span class="tag">• L4</span>
          </li>
        </ul>
      </section>

      <section class="section">
        <div class="section-title">Energi och kretslopp</div>
        <ul class="checklist">
          <li>
            <input type="checkbox" id="q5" />
            <label class="label" for="q5">Jag kan förklara varför mindre energi kan fås när den förs vidare högre upp i en näringskedja.</label>
            <span class="tag">• L3</span>
          </li>
          <li>
            <input type="checkbox" id="q6" />
            <label class="label" for="q6">Jag kan förklara nedbrytarnas betydelse och varför ämnen, som till exempel kol, cirkulerar.</label>
            <span class="tag">• L3</span>
          </li>
        </ul>
      </section>

      <section class="section">
        <div class="section-title">Människan och naturen</div>
        <ul class="checklist">
          <li>
            <input type="checkbox" id="q7" />
            <label class="label" for="q7">Jag kan tolka ett diagram och förstå hur människans påverkan på naturen förändras över tid.</label>
            <span class="tag">• L5</span>
          </li>
          <li>
            <input type="checkbox" id="q8" />
            <label class="label" for="q8">Jag kan förklara pollinering, biologisk mångfald och dess betydelse för människan.</label>
            <span class="tag">• L6</span>
          </li>
        </ul>
      </section>

      <section class="section">
        <div class="section-title">Använd och granska information</div>
        <ul class="checklist">
          <li>
            <input type="checkbox" id="q9" />
            <label class="label" for="q9">Jag kan läsa en datatabell och motivera ett miljöval med en fördel och en nackdel.</label>
            <span class="tag">• L5–6</span>
          </li>
          <li>
            <input type="checkbox" id="q10" />
            <label class="label" for="q10">Jag kan granska ett påstående och förhålla det till olika källor.</label>
            <span class="tag">• Väckans träning</span>
          </li>
        </ul>
      </section>
    </div>

    <script>
      const storageKey = 'kunna-inf%C3%B6r-provet-checks';
      const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));

      function loadChecks() {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        checkboxes.forEach((checkbox) => {
          checkbox.checked = !!saved[checkbox.id];
        });
      }

      function saveChecks() {
        const state = {};
        checkboxes.forEach((checkbox) => {
          state[checkbox.id] = checkbox.checked;
        });
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      checkboxes.forEach((checkbox) => {
        checkbox.addEventListener('change', saveChecks);
      });

      loadChecks();
    </script>
  </body>
</html>
