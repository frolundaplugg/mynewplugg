<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Studieportal Åk 7</title>
<style>
body{font-family:sans-serif;background:#121214;color:#e0e0e6;padding:15px;margin:0;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
.box{background:#1a1a1e;padding:15px;border-radius:8px;border:1px solid #29292e;margin-bottom:15px;}
button, .link-btn{background:#29292e;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;width:100%;margin-top:5px;display:block;text-align:center;text-decoration:none;box-sizing:border-box;font-size:0.9rem;font-weight:bold;}
button:hover, .link-btn:hover {background:#4fa8ff;}
input, select{width:calc(100% - 90px);padding:6px;background:#121214;color:#fff;border:1px solid #29292e;border-radius:4px;box-sizing:border-box;}
.send-btn{width:80px;display:inline-block;margin:0;vertical-align:middle;}
.chat{height:120px;overflow-y:auto;background:#121214;padding:8px;border-radius:4px;margin-bottom:5px;font-size:0.9rem;}
.q-box{display:none;background:#222226;padding:10px;border-radius:4px;margin-top:5px;}
.score-board{list-style:none;padding:0;margin:10px 0 0 0;}
.score-board li{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#121214;margin-bottom:5px;border-radius:4px;border-left:4px solid #a370f7;}
.score-board li:first-child{border-left-color:#ffd700;font-weight:bold;}
.phone-link{color:#4fa8ff;text-decoration:none;font-weight:bold;}
.write-input{width:100%;margin:5px 0;background:#121214;color:#fff;border:1px solid #29292e;}
</style></head><body>
<h2>📚 Min Studieportal - Årskurs 7 Edition</h2>
<div class="grid">
  <div class="box">
    <h3>⏱️ Timer: <span id="t">25:00</span></h3>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <input id="customMin" type="number" placeholder="Minuter..." value="25">
      <button onclick="setCustomTime()" style="width:35%;margin:0;background:#a370f7;">Sätt tid</button>
    </div>
    <button onclick="tgT()">Start/Paus</button><button onclick="rsT()" style="background:#333;">Nollställ</button>
  </div>
  <div class="box"><h3>👥 Gruppstudier (Ring)</h3><a href="https://meet.new" target="_blank" class="link-btn" style="background:#137333;">📞 Starta Google Meet</a><a href="https://zoom.new" target="_blank" class="link-btn" style="background:#0b5cff;">📹 Starta Zoom-möte</a></div>
  <div class="box" style="grid-column:span 2;">
    <h3>📞 Telefonbok</h3>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <input id="contactName" placeholder="Namn..." style="width:45%;"><input id="contactPhone" placeholder="Nummer..." style="width:35%;">
      <button onclick="addContact()" style="width:20%;margin:0;background:#2ecc71;">+ Spara</button>
    </div>
    <ul id="contactList" style="list-style:none;padding:0;"></ul>
  </div>
  <div class="box" style="grid-column:span 2;">
    <h3>🏆 Topplista - Tävla live!</h3>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <input id="pName" placeholder="Skriv kompisens namn..." style="width:75%;"><button onclick="addFriend()" style="width:25%;margin:0;">+ Lägg till</button>
    </div>
    <ul id="leaderboard" class="score-board"><li><span>👑 Du</span><span>0 p</span></li></ul>
  </div>
  <div class="box"><h3>🤖 AI-Coach</h3><div class="chat" id="cb">AI: Tjena! Redo att krossa plugget för åk 7?</div><input id="ci" placeholder="Skriv..."><button class="send-btn" onclick="sdA()">Skicka</button></div>
  <div class="box"><h3>✅ Uppgifter</h3><input id="ti" placeholder="Ny läxa..."><button class="send-btn" onclick="adT()">+ Spara</button><ul id="tl" style="list-style:none;padding:0;"></ul></div>
  <div class="box" style="grid-column:span 2;">
    <h3>📝 Ämnesutmaningar (Åk 7 Nivå)</h3>
    <label for="playerSelect" style="font-size:0.85rem;color:#aaa;"><b>Vem svarar?</b></label>
    <select id="playerSelect" style="width:100%;margin-bottom:10px;"><option value="0">Du</option></select>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;">
