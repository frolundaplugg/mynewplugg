<script>
let tm=25*60,ti=null,run=false,players=[{id:0,name:"Du",score:0}];

function upT(){let m=Math.floor(tm/60),s=tm%60;document.getElementById('t').textContent=`${m}:${s<10?'0':''}${s}`;}
function setCustomTime(){if(!run){let v=parseInt(document.getElementById('customMin').value);if(!isNaN(v)&&v>0){tm=v*60;upT();}}}
function tgT(){if(run){clearInterval(ti);run=false;}else{run=true;ti=setInterval(()=>{if(tm>0){tm--;upT();}else{clearInterval(ti);alert("Bra pluggat!");rsT();}},1000);}}
function rsT(){clearInterval(ti);let v=parseInt(document.getElementById('customMin').value);tm=(!isNaN(v)&&v>0)?v*60:25*60;upT();run=false;}
function adT(){let i=document.getElementById('ti'),v=i.value.trim();if(!v)return;document.getElementById('tl').innerHTML+=`<li><input type="checkbox" onclick="this.nextSibling.classList.toggle('done')"><span>${v}</span></li>`;i.value='';}
function shQ(id){let x=document.getElementById(id);x.style.display=x.style.display==='block'?'none':'block';}

function addContact(){
    let n=document.getElementById('contactName').value.trim(),p=document.getElementById('contactPhone').value.trim();if(!n||!p)return alert("Fyll i båda!");
    document.getElementById('contactList').innerHTML+=`<li>👤 ${n}: <a href="tel:${p.replace(/\s|-/g,'')}">${p}</a></li>`;
    document.getElementById('contactName').value='';document.getElementById('contactPhone').value='';
}

function updateLeaderboard(){
    let sorted=[...players].sort((a,b)=>b.score-a.score);let html="";
    sorted.forEach((p,index)=>{let icon=index===0?"👑 ":"";html+=`<li><span>${icon}${p.name}</span><span><b>${p.score}</b> p</span></li>`;});
    document.getElementById('leaderboard').innerHTML=html;
}

function addFriend(){
    let name = document.getElementById('pName').value.trim();
    if(!name) return alert("Skriv ett namn!");
    let newId = players.length;
    players.push({id: newId, name: name, score: 0});
    let select = document.getElementById('playerSelect');
    select.innerHTML += `<option value="${newId}">${name}</option>`;
    document.getElementById('pName').value = '';
    updateLeaderboard();
}

function resetScores(){
    players.forEach(p => p.score = 0);
    updateLeaderboard();
}

function sdA(){
    let chatInput = document.getElementById('ci');
    let msg = chatInput.value.trim();
    if(!msg) return;
    let cb = document.getElementById('cb');
    cb.innerHTML += `<br><b>Du:</b> ${msg}`;
    setTimeout(() => {
        cb.innerHTML += `<br><b>AI:</b> Grymt jobbat! Fortsätt plugga hårt! 💪`;
        cb.scrollTop = cb.scrollHeight;
    }, 800);
    chatInput.value = '';
}

function ckMix(subjectId, radioNames, radioAnswers, textIds, textAnswers){
    let points = 0;
    let activePlayerId = parseInt(document.getElementById('playerSelect').value);
    
    radioNames.forEach((name, idx) => {
        let radios = document.getElementsByName(name);
        radios.forEach(r => {
            if(r.checked && r.value === radioAnswers[idx]) points += 10;
        });
    });
    
    textIds.forEach((id, idx) => {
        let inputVal = document.getElementById(id).value.trim().toLowerCase();
        let correctVal = textAnswers[idx].toLowerCase();
        if(inputVal === correctVal) points += 10;
    });
    
    let player = players.find(p => p.id === activePlayerId);
    if(player) {
        player.score += points;
        alert(`${player.name} fick ${points} poäng!`);
    }
    
    updateLeaderboard();
    document.getElementById(subjectId).style.display = 'none'; // FIXAD: Tog bort extra .style
}
</script>
